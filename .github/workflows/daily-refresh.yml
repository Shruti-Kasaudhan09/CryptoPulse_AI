name: Daily refresh

# Runs every day after the daily candle closes (00:00 UTC):
#  1. logs today's FinBERT news sentiment straight into the database, so the
#     sentiment history survives redeploys (free RSS feeds have no archive)
#  2. triggers a Render redeploy, which re-downloads prices and retrains
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL        your Supabase connection string
#   RENDER_DEPLOY_HOOK  Render service -> Settings -> Deploy Hook URL

on:
  schedule:
    - cron: "20 0 * * *"      # 00:20 UTC = 05:50 IST
  workflow_dispatch:

jobs:
  sentiment:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret first"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install feedparser transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Score today's headlines with FinBERT
        working-directory: ml/sentiment
        run: python log_daily_sentiment.py
      - name: Save to database
        working-directory: backend
        run: python -m app.db.sync

  redeploy:
    runs-on: ubuntu-latest
    needs: sentiment
    if: ${{ always() }}         # refresh prices even if sentiment failed
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render redeploy
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set - skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
